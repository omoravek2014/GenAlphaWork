<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | GenAlpha Workbooks</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #07152e;
            color: white;
            text-align: center;
        }

        header {
            background: #102d50;
            padding: 35px;
        }

        h1 {
            color: #58a6ff;
        }

        .content {
            padding: 50px 20px;
        }

        button {
            background: #2584eb;
            color: white;
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3999ff;
        }
    </style>
</head>

<body>

<header>
    <h1>GenAlpha Workbooks</h1>
    <p>Your personal dashboard</p>
</header>

<div class="content">

    <h2>Welcome!</h2>

    <p id="userEmail">Loading account...</p>

    <button id="logoutButton">Sign Out</button>

</div>

<script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from
    "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {

        if (user) {

            document.getElementById("userEmail").textContent =
                "Logged in as: " + user.email;

        } else {

            window.location.replace("loginbackend.html");

        }

    });

    document.getElementById("logoutButton")
        .addEventListener("click", async () => {

            await signOut(auth);

            window.location.href = "loginbackend.html";

        });

</script>

</body>
</html>
