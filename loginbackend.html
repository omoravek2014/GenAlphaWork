<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GenAlpha Workbooks</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #07152e, #123c70);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background: #10233f;
            border: 1px solid #29486e;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
        }

        /* Back Button */

        .back-button {
            display: inline-block;
            padding: 10px 18px;
            margin-bottom: 20px;
            background-color: #29486e;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-button:hover {
            background-color: #3999ff;
            text-decoration: none;
            transform: translateX(-3px);
        }

        /* Logo */

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: #58a6ff;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a9bad0;
            margin-bottom: 30px;
        }

        /* Input Fields */

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #385577;
            border-radius: 8px;
            background: #091a31;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        /* Options */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 25px;
            gap: 10px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            width: auto;
            margin: 0;
        }

        /* Links */

        a {
            color: #58a6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Login Button */

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #1674dc, #3999ff);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: linear-gradient(90deg, #3999ff, #1674dc);
            transform: translateY(-2px);
        }

        /* Messages */

        .message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }

        /* Registration */

        .register {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #a9bad0;
        }

        /* Footer */

        .footer {
            text-align: center;
            color: #7188a5;
            font-size: 12px;
            margin-top: 25px;
        }

        /* Mobile */

        @media (max-width: 450px) {
            .container {
                padding: 28px 22px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <!-- Back Button -->

    <a href="index.html" class="back-button">
        ← Back
    </a>

    <!-- Logo -->

    <div class="logo">GAW</div>

    <h1>Welcome Back!</h1>

    <p class="subtitle">
        Sign in to your account.
    </p>

    <!-- Login Form -->

    <form id="loginForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <!-- Options -->

        <div class="options">

            <label class="remember">
                <input type="checkbox" id="remember">
                Remember me
            </label>

            <a href="forgotpassword.html">
                Forgot password?
            </a>

        </div>

        <!-- Submit -->

        <button type="submit" class="login-button">
            Sign In
        </button>

    </form>

    <p class="message" id="message"></p>

    <!-- Registration -->

    <div class="register">

        Don't have an account?

        <a href="register.html">
            Create one
        </a>

    </div>

    <!-- Footer -->

    <div class="footer">
        © 2026 GenAlpha Workbooks. All rights reserved.
    </div>

</div>

<!-- Firebase Authentication -->

<script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        setPersistence,
        browserLocalPersistence,
        browserSessionPersistence
    } from
    "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";


    // FIREBASE CONFIGURATION

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        appId: "YOUR_APP_ID"
    };


    // INITIALIZE FIREBASE

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // LOGIN SYSTEM

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const remember =
            document.getElementById("remember").checked;

        try {

            await setPersistence(
                auth,
                remember
                    ? browserLocalPersistence
                    : browserSessionPersistence
            );

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            window.location.href = "dashboard.html";

        } catch (error) {

            message.textContent =
                "Incorrect email or password!";

        }

    });

</script>

</body>
</html>
